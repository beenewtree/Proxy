# ==========================================================
# 规则集
# ==========================================================
# 这里补充公共规则集来源，便于按服务类型统一分流。
# 为避免规则过细、维护成本过高，优先保留核心服务分组，
# 仅对人工智能合并为一个分组，避免过多小 provider。
# 自定义规则必须优先匹配，因此放在 rules 最前面。

rule-providers:

  Direct:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.yaml"
    path: ./ruleset/Direct.yaml
