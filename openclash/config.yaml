# ==========================================================
# OpenClash / Mihomo 统一配置
# PRPR + 赔钱机场
# 保留原有策略组及自定义规则
# ==========================================================

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false

external-controller: 0.0.0.0:9090
external-ui: ui

# ==========================================================
# GEO 数据
# ==========================================================

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24

geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

# ==========================================================
# DNS
# ==========================================================

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip

  fake-ip-range: 198.18.0.1/16

  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost.ptlogin2.qq.com
    - +.msftconnecttest.com
    - +.msftncsi.com
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - "*.ntp.org.cn"
    - "*.pool.ntp.org"

# ==========================================================
# TUN
# ==========================================================
# 不启用 TUN。
# 你之前有 Tailscale 与代理软件共存的需求，这里不主动增加 TUN，
# 避免额外改变现有网络拓扑。

# ==========================================================
# 两个机场订阅
# ==========================================================

proxy-providers:

  # --------------------------------------------------------
  # 主力机场：PRPR
  # --------------------------------------------------------
  PRPR:
    type: http
    url: "<你的PRPR订阅地址>"
    path: ./proxy_provider/PRPR.yaml

    interval: 3600

    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false

  # --------------------------------------------------------
  # 备用机场：赔钱机场
  # --------------------------------------------------------
  赔钱机场:
    type: http
    url: "<你的赔钱机场订阅地址>"
    path: ./proxy_provider/赔钱机场.yaml

    interval: 3600

    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false


# ==========================================================
# 策略组
# ==========================================================

proxy-groups:

  # ==========================================================
